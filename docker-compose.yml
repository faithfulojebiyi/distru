services:
  postgres:
    # pgvector on the same Postgres 16 + Debian trixie (glibc 2.41) as the previous postgres:16 image, so
    # the existing ops-pg data directory is reused as is (no collation-version drift). The plain `pg16`
    # tag is bookworm (glibc 2.36): avoid it for an existing volume.
    image: pgvector/pgvector:pg16-trixie
    ports:
      - '127.0.0.1:5482:5432'
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    volumes:
      - ops-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ops -d ops']
      interval: 5s
      timeout: 5s
      retries: 10

  # Inngest dev server for `bun run dev` (which starts it): runs the durable workflows and calls the agent on
  # the host. UI on http://localhost:8288.
  inngest:
    image: inngest/inngest:latest
    profiles: [dev]
    command: inngest dev -u http://host.docker.internal:4111/api/inngest --no-discovery
    ports:
      - '127.0.0.1:8288:8288'
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # The whole app in one container, for trying it with nothing but Docker:
  #   docker compose --profile app up --build      → http://localhost:8080
  # Reads ANTHROPIC_API_KEY from the root .env.
  app:
    build: .
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      DATABASE_URL: postgres://ops:ops@postgres:5432/ops
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-only-secret-not-for-production-0000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PUBLIC_URL: http://localhost:8080

  # Optional trace viewer: `docker compose --profile observability up -d`, then set
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 for the agent. UI on http://localhost:16686.
  # Traces live in memory and are gone when the container stops.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [observability]
    ports:
      - '127.0.0.1:16686:16686' # UI
      - '127.0.0.1:4318:4318' # OTLP over HTTP

volumes:
  ops-pg:
