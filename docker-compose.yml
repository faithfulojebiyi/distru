services:
  postgres:
    image: postgres:16
    ports:
      - '127.0.0.1:5482:5432'
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    volumes:
      - ops-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ops -d ops']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ops-pg:
